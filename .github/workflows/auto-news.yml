name: PulseNews Auto Publisher

on:
  schedule:
    # S'exécute toutes les 2 heures
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installation des dépendances
        run: npm install

      - name: Exécution du script de rédaction
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run auto-news

      - name: Publication automatique sur GitHub
        run: |
          git config --global user.name 'PulseNews Bot'
          git config --global user.email 'bot@pulsenews.com'
          git add src/content/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(news): nouvel article automatique [skip ci]" && git push)
